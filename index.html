<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Master | Trivia Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'sans-serif'],
                    },
                    colors: {
                        apple: {
                            light: '#f5f5f7',
                            dark: '#000000',
                            cardLight: '#ffffff',
                            cardDark: '#1c1c1e',
                            textLight: '#1d1d1f',
                            textDark: '#f5f5f7',
                            accent: '#0071e3'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-apple-light text-apple-textLight dark:bg-apple-dark dark:text-apple-textDark transition-colors duration-300 min-h-screen">

    <nav class="sticky top-0 z-50 bg-white/80 dark:bg-black/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-800">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-500 to-indigo-600">Quiz Master</h1>
            <div class="flex items-center gap-4">
                <span id="score-display" class="font-medium text-sm px-3 py-1 bg-gray-100 dark:bg-gray-800 rounded-full">Score: 0</span>
                <button id="theme-toggle" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-800 transition-colors">
                    <svg id="moon-icon" class="w-5 h-5 hidden dark:block" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
                    <svg id="sun-icon" class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 py-8">
        
        <!-- Controls Section -->
        <div class="bg-apple-cardLight dark:bg-apple-cardDark rounded-2xl shadow-sm p-4 mb-8 flex flex-col md:flex-row gap-4 border border-gray-100 dark:border-gray-800">
            <select id="category-select" class="flex-1 bg-gray-50 dark:bg-gray-800 border-none rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-apple-accent outline-none">
                <option value="any">All Categories</option>
            </select>
            
            <input type="text" id="search-input" placeholder="Search questions..." class="flex-1 bg-gray-50 dark:bg-gray-800 border-none rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-apple-accent outline-none">
            
            <select id="difficulty-filter" class="bg-gray-50 dark:bg-gray-800 border-none rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-apple-accent outline-none">
                <option value="any">Any Difficulty</option>
                <option value="easy">Easy</option>
                <option value="medium">Medium</option>
                <option value="hard">Hard</option>
            </select>

            <select id="sort-select" class="bg-gray-50 dark:bg-gray-800 border-none rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-apple-accent outline-none">
                <option value="default">Default Sort</option>
                <option value="alpha-asc">A-Z</option>
                <option value="alpha-desc">Z-A</option>
                <option value="diff-asc">Difficulty (Easy -> Hard)</option>
                <option value="diff-desc">Difficulty (Hard -> Easy)</option>
            </select>
        </div>

        <div id="loader" class="flex flex-col items-center justify-center py-20">
            <div class="spinner border-4 border-gray-200 dark:border-gray-700 border-l-apple-accent dark:border-l-apple-accent rounded-full w-10 h-10 animate-spin mb-4"></div>
            <p class="text-gray-500 dark:text-gray-400">Fetching Trivia...</p>
        </div>

        <div id="empty-state" class="hidden text-center py-20">
            <p class="text-gray-500 dark:text-gray-400">No questions found matching your criteria.</p>
        </div>

        <div id="quiz-container" class="hidden">
            <div id="question-card" class="bg-apple-cardLight dark:bg-apple-cardDark rounded-3xl shadow-lg p-6 md:p-10 border border-gray-100 dark:border-gray-800">
                <div class="flex flex-wrap gap-2 mb-6">
                    <span id="category-badge" class="bg-blue-100 text-blue-800 dark:bg-blue-900/30 dark:text-blue-300 px-3 py-1 rounded-full text-xs font-semibold">Category</span>
                    <span id="difficulty-badge" class="bg-purple-100 text-purple-800 dark:bg-purple-900/30 dark:text-purple-300 px-3 py-1 rounded-full text-xs font-semibold">Easy</span>
                    <span id="question-progress" class="ml-auto text-gray-400 dark:text-gray-500 text-xs font-medium self-center">1/10</span>
                </div>
                
                <h2 id="question-text" class="text-xl md:text-2xl font-medium mb-8 leading-relaxed">Loading question...</h2>
                
                <div id="options-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Options injected here -->
                </div>
                
                <div class="mt-8 flex justify-end">
                    <button id="next-btn" class="bg-apple-accent hover:bg-blue-600 disabled:opacity-50 disabled:cursor-not-allowed text-white px-8 py-3 rounded-xl font-semibold transition-all transform active:scale-95 shadow-md">Next Question</button>
                </div>
            </div>
        </div>

        <div id="error-message" class="hidden text-center py-20 bg-red-50 dark:bg-red-900/20 rounded-2xl">
            <p class="text-red-600 dark:text-red-400 mb-4">Oops! Something went wrong while fetching the quiz.</p>
            <button onclick="location.reload()" class="bg-red-500 text-white px-6 py-2 rounded-xl font-medium hover:bg-red-600 transition-colors">Try Again</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
